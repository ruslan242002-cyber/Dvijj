<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Периферия — карта секторов</title>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<style>
  :root {
    --bg: #05070d; --panel: #121a2b; --panel2: #182339;
    --accent: #3aa0ff; --text: #e6ecf5; --muted: #7d8aa3;
    --blue: #3aa0ff; --yellow: #e8b93a; --red: #ff4d5e;
    --border: rgba(255,255,255,.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg);
    color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; padding: 68px 12px 92px; position: relative; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -2;
    background: radial-gradient(ellipse at 50% -10%, #16233f 0%, #05070d 60%);
  }
  body::after {
    content: ''; position: fixed; inset: 0; z-index: -1; opacity: .55; pointer-events: none;
    background-image:
      radial-gradient(1.6px 1.6px at 20px 30px, #fff, transparent),
      radial-gradient(1.2px 1.2px at 90px 80px, #cfe0ff, transparent),
      radial-gradient(1.4px 1.4px at 140px 20px, #fff, transparent),
      radial-gradient(1px 1px at 180px 110px, #9db8ff, transparent),
      radial-gradient(1.6px 1.6px at 40px 140px, #fff, transparent),
      radial-gradient(1px 1px at 200px 60px, #fff, transparent);
    background-repeat: repeat; background-size: 220px 220px;
  }

  .app-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; background: rgba(10,14,23,.85); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .app-bar .logo { font-size: 17px; font-weight: 800; letter-spacing: .03em; display: flex; align-items: center; gap: 8px; }
  .app-bar .badge {
    font-size: 10px; font-weight: 700; letter-spacing: .06em; color: var(--accent);
    border: 1px solid rgba(58,160,255,.4); border-radius: 6px; padding: 2px 6px; text-transform: uppercase;
  }
  .app-bar .spacer { flex: 1; }
  .app-bar .icon-btn {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 14px;
  }

  .wrap { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 19px; letter-spacing: .03em; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 12px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  .frame {
    border: 1px solid var(--border); border-radius: 18px; padding: 14px;
    background: rgba(18,26,43,.35); backdrop-filter: blur(2px);
  }
  .map-card {
    background: linear-gradient(180deg, var(--panel), var(--panel2));
    border: 1px solid var(--border); border-radius: 14px; padding: 10px;
    position: relative; overflow: hidden; box-shadow: 0 10px 24px -12px rgba(0,0,0,.5);
  }
  .zoom-controls {
    position: absolute; top: 20px; right: 20px; display: flex; flex-direction: column; gap: 6px; z-index: 2;
  }
  .zoom-controls button {
    width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--border);
    background: rgba(10,14,23,.7); color: var(--text); font-size: 15px; cursor: pointer;
  }
  #mapSvg { width: 100%; height: auto; display: block; }
  .cell { transition: opacity .15s; }
  .cell:active { opacity: .6; }
  .station-label { font-size: 7px; fill: var(--text); text-anchor: middle; }
  .tooltip {
    display: none; margin-top: 10px; padding: 10px 12px; border-radius: 10px;
    background: rgba(58,160,255,.1); border: 1px solid rgba(58,160,255,.3); font-size: 13px;
  }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
    background: rgba(10,14,23,.9); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border); display: flex; padding: 8px 6px calc(10px + env(safe-area-inset-bottom));
    gap: 4px;
  }
  .bottom-nav a {
    flex: 1; text-align: center; color: var(--muted); text-decoration: none; font-size: 10.5px;
    display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px;
    border-radius: 12px; transition: background .15s, color .15s;
  }
  .bottom-nav a.active { color: var(--accent); background: rgba(58,160,255,.12); }
  .bottom-nav a .ic { font-size: 18px; line-height: 1; }
  .bottom-nav a.soon { opacity: .35; }
</style>
</head>
<body>

<div class="app-bar">
  <div class="logo">🛰️ ПЕРИФЕРИЯ <span class="badge">Beta</span></div>
  <div class="spacer"></div>
  <div class="icon-btn">⟳</div>
</div>

<div class="wrap">
  <div class="frame">
    <h1>КАРТА СЕКТОРОВ</h1>
    <div class="sub">Вокруг четырёх станций — чем дальше от центра, тем опаснее и щедрее</div>

    <div class="legend">
      <span><i style="background:var(--blue)"></i>Патрулируемый</span>
      <span><i style="background:var(--yellow)"></i>Спорный</span>
      <span><i style="background:var(--red)"></i>Открытый космос</span>
    </div>

    <div class="map-card">
      <div class="zoom-controls"><button id="zoomIn">+</button><button id="zoomOut">−</button></div>
      <svg id="mapSvg" viewBox="0 0 400 400"></svg>
    </div>

    <div class="tooltip" id="tooltip"></div>
  </div>
</div>

<div class="bottom-nav">
  <a href="profile.html">👤<span class="ic"></span>Профиль</a>
  <a href="map.html" class="active">🗺️<span class="ic"></span>Карта</a>
  <a href="#" class="soon">🛒<span class="ic"></span>Биржа</a>
  <a href="#" class="soon">🛠️<span class="ic"></span>Крафт</a>
  <a href="#" class="soon">🏆<span class="ic"></span>Рейтинги</a>
  <a href="#" class="soon">🚀<span class="ic"></span>Флотилии</a>
</div>

<script>
// Генерируем ромбовидный кластер секторов: зона зависит от расстояния до
// ближайшей из 4 станций (по краям — синие, дальше — жёлтые, глубже — красные).
const SIZE = 17;
const CELL = 400 / (SIZE * 2 + 4);
const svg = document.getElementById('mapSvg');
const tooltip = document.getElementById('tooltip');

const STATIONS = [
  { name: 'Приют', x: -8, y: -8, color: '#35d07f' },
  { name: 'Терминус', x: 8, y: -8, color: '#7d8aa3' },
  { name: 'Арсенал', x: -8, y: 8, color: '#ff7a3a' },
  { name: 'Вуаль', x: 8, y: 8, color: '#a06bff' }
];

function zoneFor(dist) {
  if (dist <= 5) return { z: 'station', color: null };
  if (dist <= 9) return { z: 'blue', color: 'var(--blue)' };
  if (dist <= 13) return { z: 'yellow', color: 'var(--yellow)' };
  return { z: 'red', color: 'var(--red)' };
}

let svgMarkup = '';
for (let gx = -SIZE; gx <= SIZE; gx++) {
  for (let gy = -SIZE; gy <= SIZE; gy++) {
    if (Math.abs(gx) + Math.abs(gy) > SIZE + 2) continue;
    const distToStation = Math.min(...STATIONS.map(s => Math.hypot(gx - s.x, gy - s.y)));
    const { z, color } = zoneFor(distToStation);
    if (z === 'station') continue;
    const cx = 200 + gx * CELL;
    const cy = 200 + gy * CELL;
    svgMarkup += `<circle class="cell" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(CELL * 0.32).toFixed(1)}" fill="none" stroke="${color}" stroke-width="1.1" opacity="0.75" data-zone="${z}" data-x="${gx}" data-y="${gy}"/>`;
  }
}

STATIONS.forEach((s) => {
  const cx = 200 + s.x * CELL;
  const cy = 200 + s.y * CELL;
  svgMarkup += `<circle cx="${cx}" cy="${cy}" r="${CELL * 0.9}" fill="${s.color}" opacity="0.9"/>`;
  svgMarkup += `<text class="station-label" x="${cx}" y="${cy + CELL * 1.7}">${s.name}</text>`;
});

svg.innerHTML = svgMarkup;

svg.addEventListener('click', (e) => {
  const t = e.target;
  if (t.tagName !== 'circle' || !t.dataset.zone) return;
  const zoneNames = { blue: 'Патрулируемый сектор', yellow: 'Спорный сектор', red: 'Открытый космос' };
  const dangerHint = { blue: 'опасность низкая', yellow: 'PvP только по вызову', red: 'PvP без ограничений' };
  tooltip.style.display = 'block';
  tooltip.innerHTML = `<b>${zoneNames[t.dataset.zone]}</b> · сектор [${t.dataset.x}, ${t.dataset.y}]<br>${dangerHint[t.dataset.zone]}`;
});

// Зум — простое масштабирование самой SVG-карты (декоративно, без реальной навигации по секторам)
let scale = 1;
document.getElementById('zoomIn').onclick = () => { scale = Math.min(2, scale + 0.2); svg.style.transform = `scale(${scale})`; };
document.getElementById('zoomOut').onclick = () => { scale = Math.max(0.6, scale - 0.2); svg.style.transform = `scale(${scale})`; };

// VK Mini Apps должны подтвердить готовность клиенту ВК
if (window.vkBridge) { vkBridge.send('VKWebAppInit').catch(() => {}); }

// Прокидываем параметры запуска (или старый token) обратно в ссылку на профиль
const rawLaunchParams = location.search.slice(1);
const token = new URLSearchParams(location.search).get('token');
document.querySelectorAll('.bottom-nav a[href^="profile.html"]').forEach((a) => {
  if (rawLaunchParams) a.href = 'profile.html?' + rawLaunchParams;
  else if (token) a.href = 'profile.html?token=' + encodeURIComponent(token);
});
</script>
</body>
</html>
